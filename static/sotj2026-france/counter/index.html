<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Compteur des pertes fiscales de la France</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@500;600;700;800&display=swap">
<style>
/* Shared base of the Africa figure pages: TJN brand tokens for both themes, the page frame, type and controls. Each
   page adds the styles of its own figure. */
:root {
  --bg: #FCFCFA; --panel: #F2F3EF; --ink: #1B2023; --ink-2: #454E52; --muted: #687075; --rule: #D9DDD9;
  --blue: #586AAD; --blue-soft: #DEE2F1; --gold: #FFD371; --gold-soft: #FFF3D1; --gold-ink: #6B5100;
  --green: #50805E; --green-soft: #DCE9DF; --grey: #C9CED0; --land: #E2E5E1; --land-edge: #C7CCC8;
  --tip: #1B2023; --tip-fg: #FFFFFF;
  --font: "Work Sans", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15191B; --panel: #1D2326; --ink: #EDEFEC; --ink-2: #C3C9CA; --muted: #959EA1; --rule: #30393C;
  --blue: #8293E2; --blue-soft: #262D45; --gold: #FFD371; --gold-soft: #33291A; --gold-ink: #FFD371;
  --green: #7FB08E; --green-soft: #22362A; --grey: #59636A; --land: #283034; --land-edge: #3A4448;
  --tip: #EDEFEC; --tip-fg: #15191B;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15191B; --panel: #1D2326; --ink: #EDEFEC; --ink-2: #C3C9CA; --muted: #959EA1; --rule: #30393C;
  --blue: #8293E2; --blue-soft: #262D45; --gold: #FFD371; --gold-soft: #33291A; --gold-ink: #FFD371;
  --green: #7FB08E; --green-soft: #22362A; --grey: #59636A; --land: #283034; --land-edge: #3A4448;
  --tip: #EDEFEC; --tip-fg: #15191B;
  color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5 }
p { margin: 0 }
a { color: inherit; text-underline-offset: 2px }
.fig { max-width: 980px; margin: 0 auto; padding-block: 24px 32px; display: flex; flex-direction: column; gap: 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.kicker { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2) }
.kicker b { color: var(--gold-ink); font-weight: 700 }
h1 { margin: 6px 0 0; font-size: clamp(22px, 3.4vw, 32px); line-height: 1.12; font-weight: 800; letter-spacing: -.01em;
  text-wrap: balance; max-width: 32ch }
.sub { margin-top: 8px; color: var(--ink-2); font-size: 16px; max-width: 62ch }
.note { font-size: 12.5px; color: var(--muted); max-width: 78ch; line-height: 1.45 }
.num { font-variant-numeric: tabular-nums }
.controls { display: flex; flex-wrap: wrap; gap: 8px }
.controls button { font: 600 14px/1 var(--font); color: var(--ink); background: var(--bg); border: 1.5px solid var(--ink);
  border-radius: 999px; padding: 9px 16px; cursor: pointer }
.controls button[aria-pressed="true"] { background: var(--ink); color: var(--bg) }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px }
.tip { position: fixed; pointer-events: none; z-index: 20; max-width: 260px; background: var(--tip); color: var(--tip-fg);
  font-size: 13px; line-height: 1.35; padding: 8px 10px; border-radius: 6px; box-shadow: 0 4px 14px rgba(0, 0, 0, .18) }

/* Layout: one screen sized to the window, to sit in a small window or a pop-out next to the slides. The amount lost is
   the largest element and the elapsed time sits under it. The buttons, the key hint and the source are small, at the
   edges, and hidden in the pop-out. Sizes scale with the smaller side of the window. The place, the currency and the
   yearly loss come with the data, so the same page counts for Africa or for a single country. The data can also bring
   the words of the buttons and the clock, the number format and the side of the currency sign, for a page in another
   language. Without them the page is in English. */
html, body { height: 100% }
body { overflow: hidden }
.screen { height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
  gap: 2.2vmin; padding-block: 7vmin; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); cursor: pointer; user-select: none; -webkit-user-select: none }
.label { font-size: clamp(11px, 3.6vmin, 24px); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--gold-ink) }
.money { font-size: clamp(30px, 15vmin, 160px); font-weight: 800; line-height: 1; letter-spacing: -.02em; white-space: nowrap;
  font-variant-numeric: tabular-nums }
.money .cur { font-size: .5em; font-weight: 700; color: var(--ink-2); margin-right: .08em; vertical-align: .42em; letter-spacing: 0 }
.money .cur.after { margin: 0 0 0 .18em }                            /* the sign after the amount, as in French */
.rate { font-size: clamp(11px, 3vmin, 18px); color: var(--ink-2) }
.elapsed { margin-top: 1.4vmin; display: flex; flex-direction: column; gap: .4vmin }
.elapsed .k { font-size: clamp(10px, 2.8vmin, 16px); color: var(--muted); letter-spacing: .04em }
.elapsed .t { font-size: clamp(18px, 7.5vmin, 70px); font-weight: 700; font-variant-numeric: tabular-nums }
.paused .money, .paused .elapsed .t { color: var(--ink-2) }
.chrome { position: fixed; z-index: 5; display: flex; gap: 8px; top: calc(10px + env(safe-area-inset-top, 0px));
  right: max(10px, env(safe-area-inset-right, 0px)) }
.chrome button { font: 600 13px/1 var(--font); color: var(--ink); background: var(--panel); border: 1px solid var(--rule);
  border-radius: 6px; padding: 7px 10px; cursor: pointer }
.chrome button:hover { border-color: var(--ink) }
.hint { position: fixed; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  font-size: 12.5px; color: var(--muted) }
.hint kbd { display: inline-block; padding: 1px 6px; margin: 0 2px; border: 1px solid var(--rule); border-radius: 3px;
  font: 11.5px ui-monospace, Menlo, Consolas, monospace; color: var(--ink) }
.src { position: fixed; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); left: max(12px, env(safe-area-inset-left, 0px));
  max-width: 50%; text-align: left; font-size: 11.5px; line-height: 1.35; color: var(--muted) }
@media (max-height: 320px), (max-width: 520px) { .hint, .src { display: none } }
body.in-pip .chrome, body.in-pip .hint, body.in-pip .src { display: none }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }
</style>
</head>
<body>
<main class="screen" id="screen" title="Click or press Space to pause">
  <p class="label" id="label"></p>
  <p class="money" aria-hidden="true"><span class="cur" id="cur"></span><span id="amt">0</span></p>
  <p class="rate" id="rate"></p>
  <div class="elapsed" aria-hidden="true"><span class="k" id="k">time elapsed</span><span class="t" id="clock">0 min 00 s</span></div>
  <p class="sr" id="sr" aria-live="polite"></p>
</main>
<div class="chrome"><button type="button" id="popout">Pop out</button><button type="button" id="restart">Start again</button></div>
<p class="hint"><kbd>Space</kbd> pause <kbd>R</kbd> start again</p>
<p class="src" id="src"></p>

<script>
const D = {"counter": {"who": "La France", "label": "La France a perdu à cause des abus fiscaux", "cur": "€", "cur_after": true, "locale": "fr-FR", "per_year": 29079016851, "rate": "922 € par seconde · 79,7 millions d'euros par jour", "source": "Tax Justice Network, Justice Fiscale : État des Lieux 2026. 29,1 milliards d'euros par an (2023, aux prix de 2025) : abus fiscaux des multinationales et des particuliers fortunés, répartis uniformément dans le temps.", "store": "france-compteur-pertes-fiscales", "window": "france-compteur-pertes-fiscales", "ui": {"elapsed": "temps écoulé", "paused": "en pause", "popout": "Détacher", "restart": "Recommencer", "hint": "<kbd>Espace<\/kbd> pause <kbd>R<\/kbd> recommencer", "tip": "Cliquez ou appuyez sur Espace pour mettre en pause", "sr": "{who} a perdu {amount} à cause des abus fiscaux en {time}"}}};
const C = D.counter;
const RATE = C.per_year / (365 * 86400e3);               // money per millisecond: the yearly loss ÷ 365 days
const $ = id => document.getElementById(id);
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
$("label").textContent = C.label;
$("cur").textContent = C.cur;
// The words of the page and the number format. English unless the data bring others.
const U = Object.assign({ elapsed: "time elapsed", paused: "paused", popout: "Pop out", restart: "Start again",
  hint: "<kbd>Space</kbd> pause <kbd>R</kbd> start again", tip: "Click or press Space to pause",
  sr: "{who} has lost {amount} to tax abuse in {time}" }, C.ui || {});
const fmt = v => Math.floor(v).toLocaleString(C.locale || "en-US");
const money = v => C.cur_after ? `${fmt(v)}\u00a0${C.cur}` : `${C.cur}${fmt(v)}`;
if (C.cur_after) { $("cur").classList.add("after"); $("cur").parentNode.appendChild($("cur")) }
$("k").textContent = U.elapsed;
$("popout").textContent = U.popout;
$("restart").textContent = U.restart;
document.querySelector(".hint").innerHTML = U.hint;
$("screen").title = U.tip;
$("rate").textContent = C.rate;
$("src").textContent = C.source;

// The count survives a reload in the same tab, so that a slip during a talk does not reset it.
const STORE = C.store;
let run = { start: Date.now(), done: 0, on: true };
try {
  const s = JSON.parse(sessionStorage.getItem(STORE) || "null");
  if (s && typeof s.done === "number" && typeof s.start === "number") run = s;
} catch (e) {}
const save = () => { try { sessionStorage.setItem(STORE, JSON.stringify(run)) } catch (e) {} };
const elapsed = () => run.done + (run.on ? Date.now() - run.start : 0);
function clockText(ms) {
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = String(s % 60).padStart(2, "0");
  return h ? `${h} h ${String(m).padStart(2, "0")} min ${ss} s` : `${m} min ${ss} s`;
}
// I keep direct references, because the pop-out moves these elements into another document.
const el = { screen: $("screen"), amt: $("amt"), clock: $("clock"), k: $("k"), sr: $("sr") };
let host = document.body, win = window;                   // the body and the window that show the counter
function setOn(on) {
  if (on && !run.on) run.start = Date.now();
  if (!on && run.on) run.done += Date.now() - run.start;
  run.on = on;
  host.classList.toggle("paused", !on);
  el.k.textContent = on ? U.elapsed : U.paused;
  save();
}
function restart() { run = { start: Date.now(), done: 0, on: true }; setOn(true) }
function keys(e) {
  if (e.target.closest && e.target.closest("button")) return;
  if (e.code === "Space") { e.preventDefault(); setOn(!run.on) }
  if (e.key === "r" || e.key === "R") restart();
}
document.addEventListener("keydown", keys);
el.screen.addEventListener("click", () => setOn(!run.on));
$("restart").addEventListener("click", restart);

// Pop out: a small window that stays on top of the slides (Chrome and Edge). Browsers without that kind of window
// (Safari, Firefox) get a small separate window instead, which takes over the count from this page.
const inPopup = new URLSearchParams(location.search).has("popup");
if (inPopup) document.body.classList.add("in-pip");
$("popout").addEventListener("click", async () => {
  if (!("documentPictureInPicture" in window)) {
    save();
    window.open(location.href.split(/[?#]/)[0] + "?popup=1", C.window, "popup=yes,width=460,height=320");
    return;
  }
  let pip;
  try { pip = await documentPictureInPicture.requestWindow({ width: 460, height: 320 }) } catch (e) { return }
  document.querySelectorAll("style, link[rel=stylesheet]").forEach(n => pip.document.head.appendChild(n.cloneNode(true)));
  pip.document.documentElement.className = document.documentElement.className;
  const scr = el.screen;
  pip.document.body.appendChild(scr);
  host = pip.document.body;
  win = pip;                                              // the running loop moves to the pop-out on its next frame
  host.classList.toggle("paused", !run.on);
  document.body.classList.add("in-pip");
  pip.document.addEventListener("keydown", keys);
  pip.addEventListener("pagehide", () => {
    document.body.insertBefore(scr, document.body.firstChild);
    host = document.body;
    win = window;
    window.requestAnimationFrame(frame);
    document.body.classList.remove("in-pip");
    host.classList.toggle("paused", !run.on);
  });
});

let last = -1e9, lastSr = 0;
function frame() {
  const t = Date.now();
  if (!reduce || t - last > 990) {
    const ms = elapsed();
    el.amt.textContent = fmt(RATE * ms);
    el.clock.textContent = clockText(ms);
    last = t;
    if (t - lastSr > 30000) { el.sr.textContent = U.sr.replace("{who}", C.who).replace("{amount}", money(RATE * ms)).replace("{time}", clockText(ms)); lastSr = t }
  }
  win.requestAnimationFrame(frame);
}
setOn(run.on);
requestAnimationFrame(frame);
</script>

</body>
</html>
