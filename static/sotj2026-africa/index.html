<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Embargoed figure</title>
<style>
/* Layout: one small form in the middle of the window. The page holds the figure only in encrypted form (AES-GCM,
   key from the passphrase with PBKDF2-SHA-256). The browser decrypts it and replaces this page with the figure. */
:root { --bg: #FCFCFA; --ink: #1B2023; --ink-2: #454E52; --rule: #C9CED0; --accent: #586AAD; --gold-ink: #6B5100;
  --font: "Work Sans", "Helvetica Neue", Arial, sans-serif }
@media (prefers-color-scheme: dark) { :root { --bg: #15191B; --ink: #EDEFEC; --ink-2: #C3C9CA; --rule: #3A4448; --accent: #8293E2;
  --gold-ink: #FFD371; color-scheme: dark } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font) }
form { width: min(360px, calc(100% - 32px)); display: flex; flex-direction: column; gap: 12px }
.k { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--gold-ink) }
h1 { margin: 0; font-size: 22px; line-height: 1.2 }
p { margin: 0; color: var(--ink-2) }
input[type=password] { font: inherit; color: var(--ink); background: transparent; padding: 10px 12px; border: 1.5px solid var(--rule); border-radius: 6px }
label { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--ink-2) }
button { font: 600 15px/1 var(--font); color: #fff; background: var(--accent); border: 0; border-radius: 6px; padding: 12px; cursor: pointer }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
#err { color: #A8463A }
@media (prefers-color-scheme: dark) { #err { color: #E8A090 } }
</style>
</head>

  <p>Enter the passphrase to open this figure.</p>
