body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font) }
form { width: min(360px, calc(100% - 32px)); display: flex; flex-direction: column; gap: 12px }
.k { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--gold-ink) }
h1 { margin: 0; font-size: 22px; line-height: 1.2 }
p { margin: 0; color: var(--ink-2) }
input[type=password] { font: inherit; color: var(--ink); background: transparent; padding: 10px 12px; border: 1.5px solid var(--rule); border-radius: 6px }
label { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--ink-2) }
button { font: 600 15px/1 var(--font); color: #fff; background: var(--accent); border: 0; border-radius: 6px; padding: 12px; cursor: pointer }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
#err { color: #A8463A }
@media (prefers-color-scheme: dark) { #err { color: #E8A090 } }
</style>

  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function unlock(pass) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(E.salt), iterations: E.iter, hash: "SHA-256" }, base,

    document.open(); document.write(html); document.close();
  }
  document.getElementById("f").addEventListener("submit", async e => {

    const pass = document.getElementById("pw").value, btn = document.getElementById("go");

    try {
      if (document.getElementById("rem").checked) { try { localStorage.setItem(SAVED, pass) } catch (x) {} }
      await unlock(pass);
    } catch (x) {
      try { localStorage.removeItem(SAVED) } catch (y) {}
      document.getElementById("err").hidden = false; btn.disabled = false; btn.textContent = "Open";

  });
  (async () => {                                         // a passphrase remembered on this device opens the page at once
    let saved = null;
    try { saved = localStorage.getItem(SAVED) } catch (x) {}
    if (saved) { try { await unlock(saved) } catch (x) { try { localStorage.removeItem(SAVED) } catch (y) {} } }
